version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      open-pull-requests-limit: 25
      schedule:
          interval: "daily"
      # Merged without a person once CI passes (workflows/dependabot.yml), so
      # each release is left to settle first: a compromised one is usually
      # pulled within days.
      cooldown:
          default-days: 3
      groups:
          prod:
              dependency-type: "production"
              patterns:
                  - "*"
          dev:
              dependency-type: "development"
              patterns:
                  - "*"
    - package-ecosystem: "github-actions"
      directory: "/"
      open-pull-requests-limit: 25
      schedule:
          interval: "daily"
      # Merged without a person once CI passes (by a scheduled Claude task:
      # workflows/dependabot.yml's token can't merge workflow changes), so
      # each release is left to settle first: a compromised one is usually
      # pulled within days.
      cooldown:
          default-days: 3
      groups:
          prod:
              dependency-type: "production"
              patterns:
                  - "*"
          dev:
              dependency-type: "development"
              patterns:
                  - "*"
