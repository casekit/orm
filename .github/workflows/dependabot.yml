name: Dependabot
on:
    workflow_dispatch: {}
    schedule:
        # random MM to avoid a load spike on GitHub Actions at 00:00
        - cron: 34 * * * *
permissions:
    actions: write # run CI on main after merging; see "Merge PRs"
    contents: write
    statuses: read
    checks: read
jobs:
    merge_prs:
        name: "Merge PRs > 1 week old"
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Merge PRs
              run: |
                  set -e
                  # Merge the first Dependabot PR that was created more than two days ago and has all checks passing.
                  # We only merge one because we'll need to rebase after its merged, so we run this scheduled
                  # action once every hour. GitHub Actions bumps are skipped: this token can't merge a change to
                  # a workflow file, and trying would fail the job every hour and block the npm PRs behind it.
                  # A scheduled Claude task merges those once their checks pass.
                  for pr in `gh pr list --json number,author,createdAt,headRefName --search "created:<=$(date -d "2 days ago" +"%Y-%m-%d") author:app/dependabot status:success" --jq '.[] | select(.headRefName | startswith("dependabot/github_actions/") | not) | .number' | head -n 1`; do
                      if [ -n "$pr" ]; then
                          gh pr merge --squash "$pr"
                          # A merge made with this token triggers no push event, so
                          # main's CI would never run on it: start it here, so two
                          # bumps that pass alone but break together show as red.
                          gh workflow run ci.yml --ref main
                      fi
                  done
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
